[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sharaco-api"
version = "0.1.0"
description = "Backend API for Sharaco, built with FastAPI."
requires-python = ">=3.12,<3.13"
dependencies = [
	"fastapi==0.115.6",
	"uvicorn[standard]==0.34.0",
	"sqlmodel==0.0.22",
	"SQLAlchemy==2.0.46",
	"asyncpg==0.30.0",
	"psycopg2-binary==2.9.10",
	"apscheduler>=3.10.4",
	"alembic==1.14.1",
	"starlette==0.41.3",
	"python-jose[cryptography]==3.3.0",
	"authlib==1.7.2",
	"slowapi==0.1.10",
	"passlib[bcrypt]==1.7.4",
	"bcrypt==4.0.1",
	"python-multipart==0.0.20",
	"itsdangerous==2.2.0",
	"pydantic-settings==2.7.1",
	"pydantic[email]==2.10.4",
	"python-dotenv==1.0.1",
	"resend==2.6.0",
	"celery==5.4.0",
	"redis==5.2.1",
	"weasyprint==63.0",
	"jinja2==3.1.5",
	"playwright==1.60.0",
	"Pillow==10.4.0",
	"httpx==0.28.1",
	"sentry-sdk>=2.0.0",
]

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/**/*", "templates/*"]
